name: consultation-infra

services:
  elasticsearch:
    build: .  # Dockerfile을 사용하여 빌드
    container_name: consultation-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data 
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0 
    container_name: consultation-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    restart: unless-stopped

volumes:
  es_data: